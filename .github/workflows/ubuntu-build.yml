name: Build QRB ROS packages on Ubuntu

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        description: 'AWS access key ID for S3 artifact upload'
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: 'AWS secret access key for S3 artifact upload'
        required: false
    inputs:
      dependencies:
        description: 'List of repositories to checkout, e.g. "owner/repo1 owner/repo2"'
        type: string
        required: false
      colcon_args:
        description: 'Colcon build arguments, e.g. --cmake-args -DCMAKE_BUILD_TYPE=Release'
        type: string
        required: false
      ros-distro:
        description: 'ROS2 distribution to use, e.g. jazzy, lyrical'
        type: string
        required: false
        default: jazzy
      runner:
        description: 'Runner label(s): single string for GitHub-hosted (e.g. "ubuntu-26.04-arm") or JSON array for self-hosted (e.g. "[\"self-hosted\",\"arm64\"]"); auto-detected from ros-distro when empty'
        type: string
        required: false
        default: ''
      env_setup_commands:
        description: 'Shell commands to run during environment setup (use "echo VAR=value >> $GITHUB_ENV" to set persistent variables)'
        type: string
        required: false

env:
    ROS_WS: ${{ github.workspace }}/ros2_ws/
    ROS_SRC: ${{ github.workspace }}/ros2_ws/src

jobs:
  ros-build:
    runs-on: >-
      ${{
        inputs.runner != '' && fromJSON(inputs.runner) ||
        (inputs.ros-distro == 'lyrical' && 'ubuntu-26.04-arm' || 'ubuntu-24.04-arm')
      }}
    container: ros:${{ inputs.ros-distro }}
    env:
      HAS_AWS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Update and install extra packages
        env:
          ROS_DISTRO: ${{ inputs.ros-distro }}
          ENV_SETUP_COMMANDS: ${{ inputs.env_setup_commands }}
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common

          if [ "$ROS_DISTRO" != "lyrical" ]; then
            sudo add-apt-repository -y ppa:ubuntu-qcom-iot/qcom-ppa
            sudo add-apt-repository -y ppa:ubuntu-qcom-iot/qirp
            sudo apt update -y && sudo apt upgrade -y
          fi

          sudo apt install -y unzip wget python3-bloom python3-rosdep fakeroot debhelper dh-python

          if [ -n "$ENV_SETUP_COMMANDS" ]; then
            eval "$ENV_SETUP_COMMANDS"
          fi

      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          path: ${{ env.ROS_SRC }}/${{ github.event.repository.name }}

      - name: Checkout dependency
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          for repo in $DEPENDENCIES; do
            git clone https://github.com/${repo}.git ${ROS_SRC}/${repo#*/} || true
          done

      - name: Check ROS dependency
        env:
          ROS_DISTRO: ${{ inputs.ros-distro }}
        run: |
          wget https://raw.githubusercontent.com/qualcomm-qrb-ros/qrb_ros_distro/refs/heads/main/qrb-ros-dep/qcom-distribution.yaml -O ${ROS_WS}/qcom-distribution.yaml
          if [ -f /etc/ros/rosdep/sources.list.d/20-default.list ];then
            echo "yaml file://${ROS_WS}/qcom-distribution.yaml" | sudo tee -a /etc/ros/rosdep/sources.list.d/20-default.list
          fi
          sudo rosdep update
          sudo rosdep install -y --rosdistro $ROS_DISTRO --from-paths ${ROS_SRC} --ignore-src

      - name: Build ROS packages
        shell: bash
        env:
          ROS_DISTRO: ${{ inputs.ros-distro }}
          COLCON_ARGS: ${{ inputs.colcon_args }}
        run: |
          cd ${ROS_WS}
          # shellcheck source=/dev/null
          source /opt/ros/$ROS_DISTRO/setup.sh
          colcon build $COLCON_ARGS

      - name: Generate Debian packages
        continue-on-error: true
        shell: bash
        env:
          ROS_DISTRO: ${{ inputs.ros-distro }}
        run: |
          cd ${ROS_WS}
          mkdir ${ROS_WS}/debian_dir
          export OUTPUT_DIR=${ROS_WS}/debian_dir
          # shellcheck source=/dev/null
          source /opt/ros/$ROS_DISTRO/setup.sh

          for pkg in $(colcon list -t | cut -f2)
          do
            cd ${pkg}

            bloom-generate rosdebian --ros-distro "$ROS_DISTRO" -i "$(date +%s)"

            # Build package using fakeroot
            fakeroot debian/rules binary -j8

            # Move build result to the output directory
            mv ../*.deb $OUTPUT_DIR
            mv ../*.ddeb $OUTPUT_DIR
            ls -al $OUTPUT_DIR
          done

      - name: Stage build artifacts for publishing
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          build_dir=./uploads
          mkdir -p $build_dir

          tar -cvf "${build_dir}/${REPO_NAME}-ubuntu-artifacts.tar" --transform "s|^${ROS_WS}/||" -C "${ROS_WS}" install
          tar -cvf "${build_dir}/${REPO_NAME}-ubuntu-debs.tar" --transform "s|^${ROS_WS}/||" -C "${ROS_WS}" debian_dir

      - name: Upload artifacts to S3 bucket
        id: upload-artifacts
        continue-on-error: true
        if: env.HAS_AWS_CREDENTIALS == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        uses: qualcomm-qrb-ros/qrb_ros_gh_actions/.github/actions/upload-artifact@main
        with:
          path: ./uploads
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/
          s3_bucket: qli-prd-ros-gh-artifacts
          retention: 7d
